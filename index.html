<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Follow UP | SARIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เพิ่ม Library สำหรับสแกน QR/Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        :root { --primary: #6366f1; --danger: #ef4444; --success: #22c55e; --amber: #f59e0b; --slate: #0f172a; }
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; color: var(--slate); -webkit-tap-highlight-color: transparent; }
        .tab-active { color: var(--primary); font-weight: 700; border-bottom: 3px solid var(--primary); }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .modal-content { background-color: #fff; margin: 10% auto; padding: 24px; border-radius: 2rem; width: 92%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .compact-card { background: white; border-radius: 1.25rem; padding: 12px 14px; margin-bottom: 8px; border-left: 6px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); position: relative; overflow: hidden; transition: transform 0.2s; }
        .compact-card.overdue { background-color: #fff1f2 !important; }
        .priority-high { border-left-color: var(--danger) !important; }
        .priority-medium { border-left-color: var(--amber) !important; }
        .priority-low { border-left-color: var(--success) !important; }
        .timeline-container { margin: 10px 0; }
        .timeline-track { height: 5px; background: #e2e8f0; border-radius: 10px; position: relative; }
        .timeline-bar { height: 100%; position: absolute; border-radius: 10px; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .timeline-today { width: 4px; height: 12px; background: var(--slate); position: absolute; top: -3.5px; z-index: 10; border-radius: 99px; border: 1.5px solid white; }
        .btn-view-img { font-size: 8px; background: #f8fafc; color: var(--primary); padding: 3px 8px; border-radius: 6px; border: 1px solid #e2e8f0; font-weight: 700; text-transform: uppercase; }
        .sticky-search { position: sticky; top: 0; z-index: 50; background: rgba(241, 245, 249, 0.9); backdrop-filter: blur(8px); padding: 10px 0; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        #reader { width: 100%; border-radius: 1rem; overflow: hidden; border: none !important; }
        #reader__dashboard_section_csr button { background: var(--primary); color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body class="min-h-screen pb-10">
    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 p-3 px-6 bg-slate-900 text-white rounded-2xl text-xs z-[200] shadow-2xl"></div>

    <div class="max-w-xl mx-auto min-h-screen bg-white md:shadow-2xl md:my-4 md:rounded-[2.5rem] overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-slate-900 pt-6 pb-5 px-6 text-white relative">
            <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl -mr-16 -mt-16"></div>
            <div class="flex justify-between items-center relative z-10">
                <div><h1 class="text-2xl font-bold italic tracking-tight bg-gradient-to-r from-indigo-300 to-white bg-clip-text text-transparent">Work Follow UP</h1><p class="text-[9px] opacity-50 uppercase tracking-[0.2em] font-bold">Stable v2.38 | Manual Entry Fix</p></div>
                <div class="flex gap-2">
                    <button onclick="exportToCSV()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-2xl hover:bg-white/20 transition-all"><i class="fas fa-file-export text-xs"></i></button>
                    <button onclick="fetchData()" class="w-10 h-10 flex items-center justify-center bg-indigo-600 rounded-2xl shadow-lg hover:bg-indigo-500 transition-all"><i class="fas fa-sync-alt text-xs"></i></button>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-white px-2 border-b">
            <button onclick="switchTab('active')" id="tabActive" class="flex-1 py-4 text-xs font-bold transition-all tab-active">งานปัจจุบัน</button>
            <button onclick="switchTab('dashboard')" id="tabDashboard" class="flex-1 py-4 text-xs font-medium text-slate-400">สรุปงาน</button>
            <button onclick="switchTab('history')" id="tabHistory" class="flex-1 py-4 text-xs font-medium text-slate-400">ประวัติ</button>
        </div>

        <div class="p-4 flex-1">
            <div class="sticky-search mb-4">
                <div class="relative"><i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i><input type="text" id="searchInput" oninput="render()" placeholder="ค้นหา..." class="w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-xs outline-none"></div>
            </div>

            <div id="statsBar" class="hidden grid grid-cols-4 gap-2 mb-6 font-bold text-center">
                <div class="bg-slate-50 p-3 rounded-2xl border"><p class="text-[8px] text-slate-400 uppercase">Total</p><p id="statTotal" class="text-sm text-slate-800">0</p></div>
                <div class="bg-indigo-50 p-3 rounded-2xl border text-indigo-600"><p class="text-[8px]">PENDING</p><p id="statPending" class="text-sm">0</p></div>
                <div class="bg-emerald-50 p-3 rounded-2xl border text-emerald-600"><p class="text-[8px]">DONE</p><p id="statCompleted" class="text-sm">0</p></div>
                <div class="bg-rose-50 p-3 rounded-2xl border text-rose-600"><p class="text-[8px]">LATE</p><p id="statOverdue" class="text-sm">0</p></div>
            </div>

            <div id="activeSection">
                <details class="bg-indigo-600 rounded-3xl mb-6 shadow-xl overflow-hidden group border-none">
                    <summary class="p-4 cursor-pointer font-bold text-white flex justify-between items-center text-sm list-none"><span><i class="fas fa-plus-circle mr-2"></i>บันทึกงานใหม่</span><i class="fas fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i></summary>
                    <div class="p-5 pt-0 bg-white mx-1 mb-1 rounded-b-[2rem] space-y-3">
                        <div class="pt-4"><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">อาการเสีย</label><input type="text" id="taskInput" placeholder="ระบุสิ่งที่พบ..." class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">เหตุผล / หมายเหตุ</label><textarea id="reasonInput" rows="2" placeholder="เพิ่มเติม..." class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none italic"></textarea></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ประเภท</label>
                                <select id="typeInput" onchange="toggleJobTypeOther(this.value)" class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none font-medium">
                                    <optgroup label="Mold Maintenance"><option value="Repair Mold">Repair Mold</option><option value="Spare part Mold">Spare part Mold</option><option value="Modify Mold">Modify Mold</option><option value="TPM Mold">TPM Mold</option></optgroup>
                                    <optgroup label="Machine Maintenance"><option value="Repair machine">Repair machine</option><option value="Spare part machine">Spare part machine</option></optgroup>
                                    <option value="Other">ระบุเอง (Other)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">โมล/เครื่อง</label>
                                <div class="relative">
                                    <input type="text" id="assetInput" list="assetList" oninput="toggleOtherAsset(this.value)" placeholder="ค้นหา..." class="w-full p-3 pr-10 text-xs rounded-xl bg-slate-50 border-none font-medium">
                                    <button onclick="openScanner('assetInput')" class="absolute right-2 top-1/2 -translate-y-1/2 text-indigo-500 hover:text-indigo-700"><i class="fas fa-camera text-lg"></i></button>
                                </div>
                                <datalist id="assetList"></datalist>
                            </div>
                        </div>

                        <!-- ส่วนช่องกรอกระบุเอง (Hidden) -->
                        <div id="otherJobTypeWrapper" class="hidden"><input type="text" id="otherJobTypeInput" placeholder="ระบุประเภทงานใหม่..." class="w-full p-3 text-xs rounded-xl border-2 border-dashed border-indigo-200"></div>
                        <div id="otherAssetWrapper" class="hidden"><input type="text" id="otherAssetInput" placeholder="ระบุชื่อโมล/เครื่องใหม่..." class="w-full p-3 text-xs rounded-xl border-2 border-dashed border-indigo-200"></div>

                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ความเร่งด่วน</label><select id="priorityInput" class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none font-bold"><option value="low">🟢 งานทั่วไป</option><option value="medium" selected>🟡 เร่งด่วน</option><option value="high">🔴 ด่วนที่สุด</option></select></div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ผู้รับผิดชอบ</label>
                                <select id="deptInput" onchange="toggleDeptOther(this.value)" class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none font-semibold text-indigo-600">
                                    <option value="">-- เลือก --</option><option value="Sarin">Sarin</option><option value="WEN">WEN</option><option value="TP/MDS">TP/MDS</option><option value="PE">PE</option><option value="Other">ระบุเอง</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="otherDeptWrapper" class="hidden"><input type="text" id="otherDeptInput" placeholder="ระบุชื่อผู้รับผิดชอบ..." class="w-full p-3 text-xs rounded-xl border-2 border-dashed border-indigo-200"></div>

                        <div class="flex gap-3">
                            <div class="flex-1"><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">เริ่ม</label><input type="date" id="startInput" class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none"></div>
                            <div class="flex-1"><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">กำหนดเสร็จ</label><input type="date" id="endInput" class="w-full p-3 text-xs rounded-xl bg-slate-50 border-none text-rose-500 font-bold"></div>
                        </div>
                        <div class="flex items-center justify-between py-1"><input type="file" id="fileIn" multiple accept="image/*" onchange="handleImg(this, 'preIn', 'in')" class="text-[10px] w-1/2"><div id="preIn" class="flex gap-1 overflow-x-auto max-w-[50%]"></div></div>
                        <button onclick="save()" id="saveBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold uppercase text-xs shadow-lg active:scale-95 transition-all flex justify-center items-center gap-2">บันทึกข้อมูล <div class="loader" id="saveLd"></div></button>
                    </div>
                </details>
                <div id="listActive" class="space-y-3"></div>
            </div>

            <div id="filterContainer" class="hidden flex gap-1 mb-4"><select id="filterMonth" onchange="render()" class="flex-1 p-3 text-[11px] rounded-xl bg-slate-100 border-none font-medium"><option value="">ทุกเดือน</option></select><select id="filterAsset" onchange="render()" class="flex-[1.5] p-3 text-[11px] rounded-xl bg-slate-100 border-none font-medium"><option value="">ทุก Mold</option></select><button onclick="resetFilters()" class="px-4 bg-white border rounded-xl text-[10px] font-bold uppercase">ล้าง</button></div>
            <div id="dashboardSection" class="hidden space-y-3"><div id="dashList" class="space-y-3"></div></div>
            <div id="historySection" class="hidden space-y-3"><div id="listHistory" class="space-y-3"></div></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="editModal" class="modal"><div class="modal-content !rounded-[2.5rem]"><h2 class="text-lg font-bold text-slate-800 mb-5 uppercase tracking-tight italic">แก้ไขข้อมูลงาน</h2><div class="space-y-4"><input type="hidden" id="edId"><div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">อาการเสีย</label><input type="text" id="edTask" class="w-full p-3 rounded-xl bg-slate-100 border-none text-xs font-medium"></div><div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">ความเร่งด่วน</label><select id="edPriority" class="w-full p-3 rounded-xl bg-slate-100 border-none text-xs font-bold"><option value="low">🟢 งานทั่วไป</option><option value="medium">🟡 เร่งด่วน</option><option value="high">🔴 ด่วนที่สุด</option></select></div><div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">กำหนดเสร็จใหม่</label><input type="date" id="edEnd" class="w-full p-3 rounded-xl bg-slate-100 border-none text-rose-500 font-bold text-xs"></div><div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">แนบรูปเพิ่ม</label><input type="file" id="fileEd" multiple accept="image/*" onchange="handleImg(this, 'preEd', 'ed')" class="text-[10px] w-full mt-1"><div id="preEd" class="flex gap-1 mt-2 overflow-x-auto"></div></div><textarea id="edReason" rows="2" placeholder="ระบุเหตุผล..." class="w-full p-3 rounded-xl bg-slate-100 border-none text-xs font-medium"></textarea><button onclick="update()" id="upBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-xs shadow-xl transition-all">อัปเดตข้อมูล</button><button onclick="closeM('editModal')" class="w-full text-slate-400 py-2 text-xs font-bold uppercase">ยกเลิก</button></div></div></div>
    <div id="compModal" class="modal"><div class="modal-content text-center"><div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fas fa-check-circle"></i></div><h2 class="text-lg font-bold mb-1 uppercase">Finish งานซ่อม</h2><input type="file" id="fileOut" multiple accept="image/*" onchange="handleImg(this, 'preOut', 'out')" class="text-[10px] mb-4"><div id="preOut" class="flex flex-wrap gap-1 mb-5 justify-center"></div><div class="flex gap-3"><button onclick="closeM('compModal')" class="flex-1 py-3 bg-slate-100 rounded-2xl text-xs font-bold text-slate-500 uppercase">ยกเลิก</button><button onclick="complete()" id="cpBtn" class="flex-1 py-3 bg-emerald-600 text-white rounded-2xl text-xs font-bold uppercase shadow-lg">เสร็จงาน</button></div></div></div>
    <div id="delModal" class="modal"><div class="modal-content text-center"><div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i class="fas fa-trash-alt"></i></div><h2 class="text-lg font-bold mb-1 uppercase">ลบรายการ?</h2><div class="flex gap-3"><button onclick="closeM('delModal')" class="flex-1 py-3 bg-slate-100 rounded-2xl text-xs font-bold text-slate-500 uppercase">ยกเลิก</button><button onclick="confirmDel()" id="delBtn" class="flex-1 py-3 bg-rose-600 text-white rounded-2xl text-xs font-bold uppercase shadow-lg">ลบถาวร</button></div></div></div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="modal"><div class="modal-content text-center">
        <h2 class="text-lg font-bold mb-4 uppercase italic text-indigo-600"><i class="fas fa-qrcode mr-2"></i>Scan QR / Barcode</h2>
        <div id="reader" class="mb-4"></div>
        <button onclick="closeScanner()" class="w-full py-3 bg-slate-100 rounded-2xl text-xs font-bold text-slate-500 uppercase">ยกเลิก / ปิดกล้อง</button>
    </div></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMJlFc5Y24e8gD9n10Ssg2bCKs253-h8HCg4r3toAzHe1ux886slUqs19qMPiOVGD8-Q/exec";
        let tasks = [], inImgs = [], outImgs = [], edImgs = [], masterAssets = [], curId = "", currentTab = "active", targetDelId = "";
        let html5QrCode = null;
        let targetInputId = "";

        function formatThaiDate(s) { if (!s || s === "-" || s === "") return "-"; try { const d = new Date(s); if (isNaN(d.getTime())) return s; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`; } catch(e) { return s; } }
        function showToast(m) { const x = document.getElementById('toast'); if(x) { x.innerText = m; x.classList.remove('hidden'); setTimeout(() => x.classList.add('hidden'), 3000); } }
        function closeM(id) { const el = document.getElementById(id); if(el) el.style.display = 'none'; }

        async function fetchData() { 
            try { 
                const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime()); 
                const data = await res.json(); tasks = data.tasks || []; masterAssets = data.assets || []; 
                updateMasterAssetList(); updateFilters(); render(); 
            } catch (e) { console.error(e); showToast("ดึงข้อมูลล้มเหลว"); } 
        }

        function updateMasterAssetList() { const l = document.getElementById('assetList'); if(l) l.innerHTML = masterAssets.map(a => `<option value="${a.fullText}">`).join('') + '<option value="อื่นๆ (ระบุเอง)">'; }

        // --- เพิ่มฟังก์ชันจัดการ "ระบุเอง" ---
        window.toggleJobTypeOther = (v) => {
            const el = document.getElementById('otherJobTypeWrapper');
            el.className = (v === "Other") ? "block" : "hidden";
        };

        window.toggleOtherAsset = (v) => {
            const el = document.getElementById('otherAssetWrapper');
            el.className = (v === "อื่นๆ (ระบุเอง)") ? "block" : "hidden";
        };

        window.toggleDeptOther = (v) => {
            const el = document.getElementById('otherDeptWrapper');
            el.className = (v === "Other") ? "block" : "hidden";
        };

        window.openScanner = (inputId) => {
            targetInputId = inputId;
            document.getElementById('scannerModal').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                const input = document.getElementById(targetInputId);
                if (input) {
                    input.value = decodedText;
                    const found = masterAssets.find(a => a.fullText.includes(decodedText));
                    if(found) input.value = found.fullText;
                    toggleOtherAsset(input.value); // เช็คว่าต้องเปิดช่องระบุเองไหม
                }
                showToast("สแกนสำเร็จ"); closeScanner();
            }).catch(err => { showToast("Error: " + err); closeScanner(); });
        };

        window.closeScanner = () => {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => document.getElementById('scannerModal').style.display = 'none').catch(e => console.error(e));
            } else { document.getElementById('scannerModal').style.display = 'none'; }
        };

        async function handleImg(input, preId, type) {
            const pre = document.getElementById(preId); if(!pre) return; pre.innerHTML = '';
            let target = (type === 'in') ? inImgs : (type === 'out') ? outImgs : edImgs; target.length = 0;
            if (input.files) { 
                for (let f of Array.from(input.files)) { 
                    const r = new FileReader(); r.readAsDataURL(f); 
                    r.onload = (e) => { 
                        const img = new Image(); img.src = e.target.result; 
                        img.onload = () => { 
                            const can = document.createElement('canvas'); const ctx = can.getContext('2d'); 
                            let w = img.width, h = img.height, MAX = 2000; 
                            if(w > MAX || h > MAX) { if (w > h) { h = (MAX/w)*h; w = MAX; } else { w = (MAX/h)*w; h = MAX; } } 
                            can.width = w; can.height = h; ctx.drawImage(img, 0, 0, w, h); 
                            const b64 = can.toDataURL('image/jpeg', 0.9); target.push(b64); 
                            const i = document.createElement('img'); i.src = b64; i.className = "w-10 h-10 object-cover rounded-xl border shadow-sm border-white"; 
                            pre.appendChild(i); 
                        }; 
                    }; 
                } 
            }
        }

        window.save = async () => { 
            const task = document.getElementById('taskInput').value; 
            const start = document.getElementById('startInput').value; 
            const end = document.getElementById('endInput').value; 
            const reason = document.getElementById('reasonInput').value; 
            const prio = document.getElementById('priorityInput').value;

            if(!task || !end || !start) return alert("ข้อมูลไม่ครบ"); 
            const btn = document.getElementById('saveBtn'); btn.disabled = true; 

            // ตรวจสอบค่าระบุเอง
            let type = document.getElementById('typeInput').value;
            if(type === "Other") type = document.getElementById('otherJobTypeInput').value.trim();

            let asset = document.getElementById('assetInput').value.trim();
            if(asset === "อื่นๆ (ระบุเอง)") asset = document.getElementById('otherAssetInput').value.trim();

            let dept = document.getElementById('deptInput').value;
            if(dept === "Other") dept = document.getElementById('otherDeptInput').value.trim();

            try { 
                const res = await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "add", task, type, asset, startDate: start, deadline: end, images: inImgs, vendor: dept, priority: prio, reason: reason }) }); 
                const result = await res.json(); if(result.status === "success") { showToast("บันทึกสำเร็จ!"); setTimeout(() => location.reload(), 1000); } else { throw new Error(result.message); }
            } catch(e) { showToast("บันทึกไม่สำเร็จ: " + e.message); btn.disabled = false; } 
        };

        window.update = async () => { const id = document.getElementById('edId').value; const task = document.getElementById('edTask').value; const deadline = document.getElementById('edEnd').value; const reason = document.getElementById('edReason').value; const priority = document.getElementById('edPriority').value; const btn = document.getElementById('upBtn'); btn.disabled = true; try { const res = await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "update", id, task, deadline, reason, priority, images: edImgs }) }); const result = await res.json(); if(result.status === "success") { showToast("อัปเดตสำเร็จ!"); closeM('editModal'); await fetchData(); } else { throw new Error(result.message); } } catch (e) { showToast("อัปเดตล้มเหลว"); } finally { btn.disabled = false; } };
        window.complete = async () => { const btn = document.getElementById('cpBtn'); btn.disabled = true; try { await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "complete", id: curId, images: outImgs }) }); showToast("ปิดงานสำเร็จ"); closeM('compModal'); await fetchData(); } catch (e) { showToast("ล้มเหลว"); } finally { btn.disabled = false; } };
        window.openEdit = id => { const t = tasks.find(x => x.id === id); if(!t) return; document.getElementById('edId').value = t.id; document.getElementById('edTask').value = t.task; document.getElementById('edEnd').value = t.deadline || ""; document.getElementById('edReason').value = t.reason || ""; document.getElementById('edPriority').value = String(t.priority || 'medium').toLowerCase(); edImgs = []; document.getElementById('preEd').innerHTML = ''; document.getElementById('editModal').style.display = 'block'; };
        window.openComp = id => { curId = id; outImgs = []; document.getElementById('preOut').innerHTML = ''; document.getElementById('compModal').style.display = 'block'; };
        window.openDel = id => { targetDelId = id; document.getElementById('delModal').style.display = 'block'; };
        window.confirmDel = async () => { if(!targetDelId) return; const btn = document.getElementById('delBtn'); btn.disabled = true; try { await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: targetDelId }) }); showToast("ลบสำเร็จ"); closeM('delModal'); await fetchData(); } catch(e) { showToast("ลบไม่สำเร็จ"); } finally { btn.disabled = false; targetDelId = ""; } };
        window.switchTab = mode => { currentTab = mode; if (mode === 'active') resetFilters(); ['tabActive', 'tabDashboard', 'tabHistory'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('tab-active', 'font-bold'); }); const activeBtn = document.getElementById('tab' + mode.charAt(0).toUpperCase() + mode.slice(1)); if(activeBtn) activeBtn.classList.add('tab-active'); ['activeSection', 'dashboardSection', 'historySection'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('hidden'); }); const targetSection = document.getElementById(mode + 'Section'); if(targetSection) targetSection.classList.remove('hidden'); const statsBar = document.getElementById('statsBar'); if (statsBar) statsBar.style.display = (mode !== 'active') ? 'grid' : 'none'; const filterContainer = document.getElementById('filterContainer'); if (filterContainer) filterContainer.style.display = (mode !== 'active') ? 'flex' : 'none'; updateFilters(); render(); };

        const makeItem = t => {
            const today = new Date().toLocaleDateString('en-CA'); const isOver = t.status === 'pending' && t.deadline < today; const isDone = t.status === 'completed';
            const start = new Date(t.startDate || today); const end = new Date(t.deadline || today); const now = new Date(today); const total = end - start; const elapsed = now - start;
            let progress = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0; if(isDone) progress = 100;
            const p = String(t.priority || "medium").toLowerCase(); const prioClass = p === 'high' ? 'priority-high' : p === 'medium' ? 'priority-medium' : 'priority-low';
            const prioEmoji = p === 'high' ? '🔴' : p === 'medium' ? '🟡' : '🟢'; const prioLabel = p === 'high' ? 'URGENT' : p === 'medium' ? 'NORMAL' : 'LOW';
            const imgs = (t.imageUrl ? String(t.imageUrl).split(',') : []).concat(t.finishImageUrl ? String(t.finishImageUrl).split(',') : [])
                .map(u => u.trim()).filter(u => u && u.startsWith('http'))
                .map(u => `<div class="flex flex-col items-center gap-1 shrink-0"><img src="${u}" class="w-10 h-10 object-cover rounded-xl border shadow-sm border-white" onerror="this.classList.add('hidden');"><button onclick="window.open('${u}')" class="btn-view-img">VIEW</button></div>`).join('');
            return `<div class="compact-card ${isOver?'overdue':''} ${prioClass}"><div class="flex justify-between items-start"><div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-2"><span class="text-[7px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-500 uppercase">${t.type}</span><span class="text-[7px] font-bold px-2 py-0.5 rounded-lg ${p==='high'?'bg-rose-100 text-rose-600 animate-pulse':'bg-slate-50 text-slate-400'} uppercase">${prioLabel}</span>${isOver?'<span class="text-[7px] font-bold px-2 py-0.5 rounded bg-rose-600 text-white animate-pulse">LATE</span>':''}</div><h3 class="text-sm font-bold text-slate-800 leading-tight truncate italic mb-1">${prioEmoji} ${t.task}</h3><p class="text-[11px] text-indigo-600 font-bold mb-3"><i class="fas fa-cube mr-1 opacity-50"></i>${t.asset}</p><div class="timeline-container"><div class="flex justify-between text-[7px] font-bold text-slate-400 uppercase mb-1"><span>START: ${formatThaiDate(t.startDate)}</span><span>FINISH: ${formatThaiDate(t.deadline)}</span></div><div class="timeline-track"><div class="timeline-bar ${isDone?'bg-emerald-500':isOver?'bg-rose-500':'bg-indigo-500'}" style="width: ${progress}%"></div>${!isDone ? `<div class="timeline-today" style="left: ${progress}%"></div>` : ''}</div></div><div class="flex items-center gap-3 mt-2"><div class="text-[10px] text-slate-500 font-bold bg-slate-50 px-2 py-1 rounded-lg">R: ${t.vendor||'-'}</div><div class="flex gap-2 items-center overflow-x-auto scrollbar-hide">${imgs}</div></div>${t.reason ? `<p class="text-[9px] text-amber-700 font-medium mt-3 italic p-2 bg-amber-50 rounded-xl border border-amber-100 line-clamp-2">Note: ${t.reason}</p>` : ''}</div><div class="flex flex-col gap-2 ml-3 shrink-0">${t.status==='pending' ? `<button onclick="window.openComp('${t.id}')" class="w-10 h-10 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-lg active:scale-90 transition-all"><i class="fas fa-check text-xs"></i></button><button onclick="window.openEdit('${t.id}')" class="w-10 h-10 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-lg active:scale-90 transition-all"><i class="fas fa-edit text-xs"></i></button>` : ''}<button onclick="window.openDel('${t.id}')" class="w-10 h-10 rounded-2xl bg-white border border-slate-200 text-slate-300 flex items-center justify-center active:bg-rose-500 active:text-white transition-all"><i class="fas fa-trash-alt text-xs"></i></button></div></div></div>`;
        };

        function render() { const s = document.getElementById('searchInput').value.toLowerCase(); const today = new Date().toLocaleDateString('en-CA'); const fm = document.getElementById('filterMonth').value; const fa = document.getElementById('filterAsset').value; const filtered = tasks.filter(t => { const mS = (t.task||"").toLowerCase().includes(s) || (t.asset||"").toLowerCase().includes(s); const mM = !fm || (t.deadline && String(t.deadline).startsWith(fm)); const mA = !fa || t.asset === fa; return mS && mM && mA; }); const st = document.getElementById('statTotal'); if(st) { st.innerText = filtered.length; document.getElementById('statPending').innerText = filtered.filter(t=>t.status==='pending').length; document.getElementById('statCompleted').innerText = filtered.filter(t=>t.status==='completed').length; document.getElementById('statOverdue').innerText = filtered.filter(t=>t.status==='pending' && t.deadline < today).length; } document.getElementById('listActive').innerHTML = tasks.filter(t=>t.status==='pending' && ((t.task||"").toLowerCase().includes(s) || (t.asset||"").toLowerCase().includes(s))).reverse().map(makeItem).join('') || '<div class="text-center py-10"><p class="text-slate-300 text-xs font-bold">No records found</p></div>'; document.getElementById('listHistory').innerHTML = filtered.filter(t=>t.status==='completed').reverse().map(makeItem).join('') || '<p class="text-center py-10 text-slate-300 text-[10px] font-bold">No history</p>'; document.getElementById('dashList').innerHTML = filtered.filter(t=>t.status==='pending').sort((a,b)=>(a.deadline||'9999')>(b.deadline||'9999')?1:-1).map(makeItem).join(''); }
        function exportToCSV() { if(tasks.length === 0) return showToast("ไม่มีข้อมูล"); let csv = "\uFEFFID,Task,Asset,Type,StartDate,Deadline,Status,Technician,Priority,Reason\n"; tasks.forEach(t => { csv += `"${t.id}","${t.task}","${t.asset}","${t.type}","${t.startDate}","${t.deadline}","${t.status}","${t.vendor}","${t.priority || 'medium'}","${t.reason || ''}"\n`; }); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.setAttribute("download", `repair_report_${new Date().toLocaleDateString()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link); }
        function updateFilters() { const fA = document.getElementById('filterAsset'); const fM = document.getElementById('filterMonth'); if(!fA || !fM) return; let relS = currentTab === 'dashboard' ? 'pending' : 'completed'; const molds = [...new Set(tasks.filter(t => t.status === relS).map(t => t.asset))].sort(); fA.innerHTML = '<option value="">ทั้งหมด</option>' + molds.map(a => `<option value="${a}">${a}</option>`).join(''); const mons = [...new Set(tasks.filter(t => t.deadline).map(t => String(t.deadline).substring(0, 7)))].filter(m => m && m != "-").sort().reverse(); fM.innerHTML = '<option value="">ทุกเดือน</option>' + mons.map(m => `<option value="${m}">${m}</option>`).join(''); }
        window.resetFilters = () => { document.getElementById('filterMonth').value = ""; document.getElementById('filterAsset').value = ""; render(); };
        window.onload = fetchData;
        window.onclick = e => { if (e.target.className === 'modal') { closeM('editModal'); closeM('compModal'); closeM('delModal'); closeScanner(); } };
    </script>
</body>
</html>
