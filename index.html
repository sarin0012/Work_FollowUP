<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Follow UP | SARIN Premium Black</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Chart.js สำหรับ Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Kanit:wght@200;300;400;500;600&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --accent: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --bg-slate: #f8fafc;
            --header-black: #020617;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif; 
            background-color: var(--bg-slate);
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        .premium-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn {
            position: relative;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: var(--primary);
            font-weight: 700;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 4px;
            background: var(--primary);
            border-radius: 10px;
        }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(8px); 
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content { 
            background: white; 
            margin: 10% auto; 
            padding: 2rem; 
            border-radius: 2rem; 
            width: 92%; 
            max-width: 450px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(0);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .status-pill {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .priority-high { border-left: 6px solid var(--danger); }
        .priority-medium { border-left: 6px solid var(--warning); }
        .priority-low { border-left: 6px solid var(--accent); }

        .timeline-bar-bg { height: 6px; background: #e2e8f0; border-radius: 10px; position: relative; overflow: hidden; }
        .timeline-bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease-out; }

        #reader { width: 100%; border-radius: 1.5rem; overflow: hidden; border: none !important; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        .nav-blur {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .btn-view-img { 
            font-size: 9px; 
            background: #f1f5f9; 
            color: #475569; 
            padding: 4px 10px; 
            border-radius: 8px; 
            border: 1px solid #e2e8f0; 
            font-weight: 800; 
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-view-img:active { background: #cbd5e1; transform: scale(0.9); }
        
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">
    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 p-4 px-8 bg-slate-900 text-white rounded-2xl text-sm font-semibold z-[2000] shadow-2xl flex items-center gap-3">
        <i class="fas fa-info-circle text-indigo-400"></i>
        <span id="toastMsg"></span>
    </div>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto min-h-screen bg-slate-50 md:shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Premium BLACK Header -->
        <header class="bg-[#020617] pt-8 pb-14 px-6 text-white relative">
            <div class="absolute top-0 right-0 w-64 h-64 bg-indigo-600/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
            <div class="absolute top-1/2 left-0 w-32 h-32 bg-indigo-500/5 rounded-full -ml-16 blur-2xl"></div>
            
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tighter italic bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Work Follow UP</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(99,102,241,0.8)]"></span>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-[0.3em]">Premium v2.46 | Machine Modify</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportToCSV()" title="Export Excel" class="w-11 h-11 flex items-center justify-center bg-white/5 hover:bg-white/10 rounded-2xl transition-all border border-white/10 shadow-lg"><i class="fas fa-file-export text-sm"></i></button>
                    <button onclick="fetchData()" title="Refresh" class="w-11 h-11 flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl transition-all shadow-[0_10px_20px_-5px_rgba(79,70,229,0.4)]"><i class="fas fa-sync-alt text-sm"></i></button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="nav-blur sticky top-0 z-50 flex px-4 -mt-7 border-b border-slate-200 shadow-sm mx-4 rounded-3xl premium-card overflow-hidden">
            <button onclick="switchTab('active')" id="tabActive" class="flex-1 py-5 text-xs font-bold transition-all tab-btn active">งานในมือ</button>
            <button onclick="switchTab('dashboard')" id="tabDashboard" class="flex-1 py-5 text-xs font-medium text-slate-400 transition-all tab-btn">สรุปงาน</button>
            <button onclick="switchTab('history')" id="tabHistory" class="flex-1 py-5 text-xs font-medium text-slate-400 transition-all tab-btn">ประวัติซ่อม</button>
        </nav>

        <main class="p-4 flex-1">
            <!-- Global Search -->
            <div id="searchWrapper" class="mb-6">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-500 transition-colors">
                        <i class="fas fa-search text-sm"></i>
                    </div>
                    <input type="text" id="searchInput" oninput="render()" placeholder="ค้นหาตามชื่อโมล, อาการ หรือรหัส..." class="w-full pl-12 pr-4 py-4 bg-white border-none rounded-2xl text-sm outline-none shadow-sm focus:ring-4 focus:ring-indigo-500/10 transition-all font-medium">
                </div>
            </div>

            <!-- ACTIVE LIST SECTION -->
            <div id="activeSection" class="space-y-4">
                <!-- Add Task Form -->
                <details class="bg-indigo-600 rounded-3xl shadow-xl overflow-hidden group border-none transition-all">
                    <summary class="p-5 cursor-pointer font-bold text-white flex justify-between items-center text-sm list-none select-none">

                                    <optgroup label="Mold"><option value="Repair Mold">Repair Mold</option><option value="Spare part Mold">Spare part Mold</option><option value="Modify Mold">Modify Mold</option><option value="TPM Mold">TPM Mold</option></optgroup>
                                    <optgroup label="Machine"><option value="Repair machine">Repair machine</option><option value="Spare part machine">Spare part machine</option><option value="Modify machine">Modify machine</option></optgroup>
                                    <option value="Other">ระบุเอง (Other)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 uppercase ml-1">โมล/เครื่อง</label>
                                <div class="relative mt-1">
                                    <input type="text" id="assetInput" list="assetList" oninput="toggleOtherAsset(this.value)" placeholder="ค้นหา..." class="w-full p-4 pr-12 bg-slate-50 border-none rounded-2xl text-sm font-bold">
                                    <button onclick="openScanner('assetInput')" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-indigo-100 text-indigo-600 rounded-xl hover:bg-indigo-600 hover:text-white transition-all"><i class="fas fa-qrcode"></i></button>
                                </div>
                                <datalist id="assetList"></datalist>
                            </div>
                        </div>

                        <div id="otherJobTypeWrapper" class="hidden"><input type="text" id="otherJobTypeInput" placeholder="ระบุประเภทงานใหม่..." class="w-full p-4 bg-white border-2 border-dashed border-indigo-100 rounded-2xl text-sm font-medium"></div>
                        <div id="otherAssetWrapper" class="hidden"><input type="text" id="otherAssetInput" placeholder="ระบุชื่อใหม่..." class="w-full p-4 bg-white border-2 border-dashed border-indigo-100 rounded-2xl text-sm font-medium"></div>

                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">ความเร่งด่วน</label><select id="priorityInput" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-black"><option value="low">🟢 ต่ำ</option><option value="medium" selected>🟡 กลาง</option><option value="high">🔴 สูง</option></select></div>
                            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">ผู้รับผิดชอบ</label><select id="deptInput" onchange="toggleDeptOther(this.value)" class="w-full p-4 mt-1 bg-indigo-50 border-none rounded-2xl text-sm font-extrabold text-indigo-700"><option value="">-- เลือก --</option><option value="Sarin">Sarin</option><option value="WEN">WEN</option><option value="TP/MDS">TP/MDS</option><option value="PE">PE</option><option value="Other">ระบุเอง</option></select></div>
                        </div>
                        
                        <div id="otherDeptWrapper" class="hidden"><input type="text" id="otherDeptInput" placeholder="ระบุชื่อ..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm"></div>

                        <div class="flex gap-4">
                            <div class="flex-1"><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">เริ่ม</label><input type="date" id="startInput" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-medium"></div>
                            <div class="flex-1"><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">กำหนดเสร็จ</label><input type="date" id="endInput" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-bold text-rose-500"></div>
                        </div>

                        <div class="flex items-center justify-between py-2">
                            <div class="flex-1"><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">แนบรูป</label><input type="file" id="fileIn" multiple accept="image/*" onchange="handleImg(this, 'preIn', 'in')" class="hidden"><label for="fileIn" class="flex items-center gap-2 mt-1 w-fit px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl cursor-pointer text-xs font-bold text-slate-600 transition-colors"><i class="fas fa-image"></i> เลือกรูป</label></div>
                            <div id="preIn" class="flex gap-2 overflow-x-auto max-w-[60%] py-1"></div>
                        </div>

                        <button onclick="save()" id="saveBtn" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black uppercase text-sm shadow-xl flex justify-center items-center gap-3 active:scale-95 transition-all"><i class="fas fa-save"></i> บันทึกข้อมูล <div class="loader" id="saveLd"></div></button>
                    </div>
                </details>

                <!-- Sorting Bar -->
                <div class="flex items-center justify-between px-2 py-1">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Jobs</p>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-sort-amount-down text-slate-400 text-xs"></i>
                        <select id="sortActive" onchange="render()" class="bg-transparent border-none text-[10px] font-black text-indigo-600 outline-none uppercase cursor-pointer">
                            <option value="deadline">📅 เรียงตาม: กำหนดเสร็จ</option>
                            <option value="priority">🚩 เรียงตาม: ความสำคัญ</option>
                            <option value="type">🛠️ เรียงตาม: ประเภทงาน</option>
                        </select>
                    </div>
                </div>

                <div id="listActive" class="space-y-4"></div>
            </div>

            <!-- DASHBOARD SECTION -->
            <div id="dashboardSection" class="hidden space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="premium-card p-5 border-l-8 border-indigo-500"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">งานทั้งหมด</p><p id="dashTotal" class="text-3xl font-black text-slate-800">0</p></div>
                    <div class="premium-card p-5 border-l-8 border-amber-500"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">รอดำเนินการ</p><p id="dashPending" class="text-3xl font-black text-slate-800">0</p></div>
                    <div class="premium-card p-5 border-l-8 border-emerald-500"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">เสร็จสมบูรณ์</p><p id="dashCompleted" class="text-3xl font-black text-slate-800">0</p></div>
                    <div class="premium-card p-5 border-l-8 border-rose-500"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">เลยกำหนด</p><p id="dashOverdue" class="text-3xl font-black text-slate-800">0</p></div>
                </div>
                <div class="premium-card p-6">
                    <h3 class="text-sm font-extrabold mb-4 flex items-center gap-2"><i class="fas fa-chart-pie text-indigo-500"></i> Job Distribution</h3>
                    <div class="relative h-64"><canvas id="jobTypeChart"></canvas></div>
                </div>
                <div class="premium-card p-6">
                    <h3 class="text-sm font-extrabold mb-4 text-slate-800">Priority Summary</h3>
                    <div class="space-y-4" id="priorityBars"></div>
                </div>
            </div>

            <!-- HISTORY LIST SECTION -->
            <div id="historySection" class="hidden space-y-4">
                <div id="filterContainer" class="flex gap-2 mb-4 p-3 bg-white rounded-2xl shadow-sm">
                    <select id="filterMonth" onchange="render()" class="flex-1 bg-transparent border-none text-[11px] font-bold outline-none"><option value="">ทุกเดือน</option></select>
                    <select id="filterAsset" onchange="render()" class="flex-[1.5] bg-transparent border-none text-[11px] font-bold outline-none border-l pl-2"><option value="">ทุก Mold</option></select>
                    <button onclick="resetFilters()" class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl text-[10px] font-black uppercase">ล้าง</button>
                </div>
                <div id="listHistory" class="space-y-4"></div>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    <div id="editModal" class="modal"><div class="modal-content">
        <h2 class="text-2xl font-black text-slate-800 mb-6 italic tracking-tight flex items-center gap-2"><i class="fas fa-edit text-indigo-500"></i> EDIT JOB</h2>
        <div class="space-y-5">
            <input type="hidden" id="edId">
            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">อาการเสีย</label><input type="text" id="edTask" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-semibold"></div>
            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">ความเร่งด่วน</label><select id="edPriority" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-black"><option value="low">🟢 งานทั่วไป</option><option value="medium">🟡 เร่งด่วน</option><option value="high">🔴 ด่วนที่สุด</option></select></div>
            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">กำหนดเสร็จใหม่</label><input type="date" id="edEnd" class="w-full p-4 mt-1 bg-slate-50 border-none rounded-2xl text-sm font-black text-rose-500"></div>
            <div><label class="text-[11px] font-bold text-slate-400 uppercase ml-1">แนบรูปเพิ่ม</label><input type="file" id="fileEd" multiple accept="image/*" onchange="handleImg(this, 'preEd', 'ed')" class="text-[10px] w-full mt-1"><div id="preEd" class="flex gap-2 mt-3 overflow-x-auto py-1"></div></div>
            <textarea id="edReason" rows="2" placeholder="ระบุเหตุผลการแก้ไข..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm italic font-medium"></textarea>
            <div class="flex gap-3 pt-4"><button onclick="closeM('editModal')" class="flex-1 py-4 text-slate-400 font-bold text-xs uppercase">ยกเลิก</button><button onclick="update()" id="upBtn" class="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-black text-xs shadow-xl active:scale-95 transition-all">อัปเดตข้อมูล</button></div>
        </div>
    </div></div>

    <div id="compModal" class="modal"><div class="modal-content text-center">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner animate-bounce"><i class="fas fa-check-double"></i></div>
        <h2 class="text-2xl font-extrabold mb-1 uppercase">Job Finished</h2>
        <p class="text-slate-400 text-xs mb-8 font-medium italic">Upload proof of completion</p>
        <input type="file" id="fileOut" multiple accept="image/*" onchange="handleImg(this, 'preOut', 'out')" class="hidden"><label for="fileOut" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-100 hover:bg-slate-200 rounded-2xl cursor-pointer text-xs font-black text-slate-600 mb-6 transition-all border border-slate-200"><i class="fas fa-camera"></i> เลือกรูปงานเสร็จ</label>
        <div id="preOut" class="flex flex-wrap gap-2 mb-8 justify-center"></div>
        <div class="flex gap-4"><button onclick="closeM('compModal')" class="flex-1 py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-400 uppercase">ยกเลิก</button><button onclick="complete()" id="cpBtn" class="flex-[2] py-4 bg-emerald-600 text-white rounded-2xl text-xs font-black shadow-lg shadow-emerald-200">ปิดงาน</button></div>
    </div></div>

    <div id="delModal" class="modal"><div class="modal-content text-center p-8">
        <div class="w-20 h-20 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl"><i class="fas fa-trash-alt"></i></div>
        <h2 class="text-2xl font-extrabold mb-2 uppercase">ลบรายการ?</h2>
        <div class="flex gap-4"><button onclick="closeM('delModal')" class="flex-1 py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-500 uppercase">ยกเลิก</button><button onclick="confirmDel()" id="delBtn" class="flex-1 py-4 bg-rose-600 text-white rounded-2xl text-xs font-black shadow-lg">ลบ</button></div>
    </div></div>

    <div id="scannerModal" class="modal"><div class="modal-content text-center overflow-hidden !p-0">
        <div class="p-6">
            <h2 class="text-xl font-black mb-4 uppercase italic text-indigo-600 flex items-center justify-center gap-3"><i class="fas fa-qrcode"></i> QR SCANNER</h2>
            <div id="reader" class="mb-4"></div>
            <button onclick="closeScanner()" class="w-full py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-500 uppercase">ปิดหน้าต่าง</button>
        </div>
    </div></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMJlFc5Y24e8gD9n10Ssg2bCKs253-h8HCg4r3toAzHe1ux886slUqs19qMPiOVGD8-Q/exec";
        let tasks = [], inImgs = [], outImgs = [], edImgs = [], masterAssets = [], curId = "", currentTab = "active", targetDelId = "";
        let html5QrCode = null, jobChart = null;

        function formatThaiDate(s) { if (!s || s === "-" || s === "") return "-"; try { const d = new Date(s); return isNaN(d.getTime()) ? s : `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}`; } catch(e) { return s; } }
        function showToast(m) { const x = document.getElementById('toast'); const msg = document.getElementById('toastMsg'); if(x) { msg.innerText = m; x.classList.remove('hidden'); setTimeout(() => x.classList.add('hidden'), 3500); } }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        // ฟังก์ชันช่วยจัดการรูปภาพที่โหลดไม่สำเร็จ
        window.handleImgError = (imgEl) => {
            const container = imgEl.parentElement;
            container.innerHTML = '<div class="w-full h-full flex items-center justify-center"><i class="fas fa-image text-slate-300 text-xl"></i></div>';
        };

        async function fetchData() { try { const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime()); const data = await res.json(); tasks = data.tasks || []; masterAssets = data.assets || []; updateMasterAssetList(); updateFilters(); render(); } catch (e) { console.error(e); showToast("ดึงข้อมูลล้มเหลว"); } }
        function updateMasterAssetList() { const l = document.getElementById('assetList'); if(l) l.innerHTML = masterAssets.map(a => `<option value="${a.fullText}">`).join('') + '<option value="อื่นๆ (ระบุเอง)">'; }

        window.toggleJobTypeOther = (v) => { document.getElementById('otherJobTypeWrapper').classList.toggle('hidden', v !== "Other"); };
        window.toggleOtherAsset = (v) => { document.getElementById('otherAssetWrapper').classList.toggle('hidden', v !== "อื่นๆ (ระบุเอง)"); };
        window.toggleDeptOther = (v) => { document.getElementById('otherDeptWrapper').classList.toggle('hidden', v !== "Other"); };

        window.openScanner = (inputId) => {
            targetInputId = inputId; document.getElementById('scannerModal').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                const input = document.getElementById(targetInputId);
                if (input) { input.value = decodedText; const found = masterAssets.find(a => a.fullText.includes(decodedText)); if(found) input.value = found.fullText; toggleOtherAsset(input.value); }
                showToast("สแกนสำเร็จ"); closeScanner();
            }).catch(err => { showToast("Error: " + err); closeScanner(); });
        };
        window.closeScanner = () => { if (html5QrCode && html5QrCode.isScanning) { html5QrCode.stop().then(() => document.getElementById('scannerModal').style.display = 'none'); } else { document.getElementById('scannerModal').style.display = 'none'; } };

        async function handleImg(input, preId, type) {
            const pre = document.getElementById(preId); if(!pre) return; pre.innerHTML = '';
            let target = (type === 'in') ? inImgs : (type === 'out') ? outImgs : edImgs; target.length = 0;
            if (input.files) { 
                for (let f of Array.from(input.files)) { 
                    const r = new FileReader(); r.readAsDataURL(f); 
                    r.onload = (e) => { 
                        const img = new Image(); img.src = e.target.result; 
                        img.onload = () => { 
                            const can = document.createElement('canvas'); const ctx = can.getContext('2d'); 
                            let w = img.width, h = img.height, MAX = 2000; 
                            if(w > MAX || h > MAX) { if (w > h) { h = (MAX/w)*h; w = MAX; } else { w = (MAX/h)*w; h = MAX; } } 
                            can.width = w; can.height = h; ctx.drawImage(img, 0, 0, w, h); 
                            const b64 = can.toDataURL('image/jpeg', 0.9); target.push(b64); 
                            const i = document.createElement('img'); i.src = b64; i.className = "w-12 h-12 object-cover rounded-xl border border-slate-200"; 
                            pre.appendChild(i); 
                        }; 
                    }; 
                } 
            }
        }

        window.save = async () => { 
            const task = document.getElementById('taskInput').value; const start = document.getElementById('startInput').value; const end = document.getElementById('endInput').value; const reason = document.getElementById('reasonInput').value; const prio = document.getElementById('priorityInput').value;
            if(!task || !end || !start) return alert("กรุณาระบุข้อมูลอาการเสียและวันที่ให้ครบถ้วน"); 
            const btn = document.getElementById('saveBtn'); btn.disabled = true; document.getElementById('saveLd').style.display = 'block';
            let type = document.getElementById('typeInput').value; if(type === "Other") type = document.getElementById('otherJobTypeInput').value.trim();
            let asset = document.getElementById('assetInput').value.trim(); if(asset === "อื่นๆ (ระบุเอง)") asset = document.getElementById('otherAssetInput').value.trim();
            let dept = document.getElementById('deptInput').value; if(dept === "Other") dept = document.getElementById('otherDeptInput').value.trim();
            try { 
                const res = await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "add", task, type, asset, startDate: start, deadline: end, images: inImgs, vendor: dept, priority: prio, reason: reason }) }); 
                const result = await res.json(); if(result.status === "success") { showToast("บันทึกสำเร็จ!"); location.reload(); } else { throw new Error(result.message); }
            } catch(e) { showToast("บันทึกไม่สำเร็จ"); } finally { btn.disabled = false; document.getElementById('saveLd').style.display = 'none'; } 
        };

        window.update = async () => { const id = document.getElementById('edId').value; const task = document.getElementById('edTask').value; const deadline = document.getElementById('edEnd').value; const reason = document.getElementById('edReason').value; const priority = document.getElementById('edPriority').value; const btn = document.getElementById('upBtn'); btn.disabled = true; try { const res = await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "update", id, task, deadline, reason, priority, images: edImgs }) }); const result = await res.json(); if(result.status === "success") { showToast("อัปเดตสำเร็จ!"); closeM('editModal'); fetchData(); } else { throw new Error(result.message); } } catch (e) { showToast("อัปเดตล้มเหลว"); } finally { btn.disabled = false; } };
        window.complete = async () => { const btn = document.getElementById('cpBtn'); btn.disabled = true; try { await fetch(SCRIPT_URL, { method: "POST", headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: "complete", id: curId, images: outImgs }) }); showToast("ปิดงานสำเร็จ!"); closeM('compModal'); fetchData(); } catch (e) { showToast("ล้มเหลว"); } finally { btn.disabled = false; } };
        window.confirmDel = async () => { if(!targetDelId) return; const btn = document.getElementById('delBtn'); btn.disabled = true; try { await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "delete", id: targetDelId }) }); showToast("ลบข้อมูลแล้ว"); closeM('delModal'); fetchData(); } catch(e) { showToast("ลบไม่สำเร็จ"); } finally { btn.disabled = false; targetDelId = ""; } };

        window.switchTab = mode => { 
            currentTab = mode; 
            ['tabActive', 'tabDashboard', 'tabHistory'].forEach(id => { const el = document.getElementById(id); if (el) { el.classList.remove('active', 'text-indigo-600', 'font-bold'); el.classList.add('text-slate-400'); } });
            const activeBtn = document.getElementById('tab' + mode.charAt(0).toUpperCase() + mode.slice(1)); if(activeBtn) activeBtn.classList.add('active');
            ['activeSection', 'dashboardSection', 'historySection', 'searchWrapper'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('hidden'); });
            document.getElementById(mode + 'Section').classList.remove('hidden');
            if(mode !== 'dashboard') document.getElementById('searchWrapper').classList.remove('hidden');
            render(); 
        };

        const makeItem = t => {
            const today = new Date().toLocaleDateString('en-CA'); const isOver = t.status === 'pending' && t.deadline < today; const isDone = t.status === 'completed';
            const start = new Date(t.startDate || today); const end = new Date(t.deadline || today); const now = new Date(today); const total = end - start; const elapsed = now - start;
            let progress = total > 0 ? Math.min(100, Math.max(0, (elapsed / total) * 100)) : 0; if(isDone) progress = 100;
            const p = String(t.priority || "medium").toLowerCase(); const prioClass = p === 'high' ? 'priority-high' : p === 'medium' ? 'priority-medium' : 'priority-low';
            const prioEmoji = p === 'high' ? '🔴' : p === 'medium' ? '🟡' : '🟢'; const prioLabel = p === 'high' ? 'CRITICAL' : p === 'medium' ? 'URGENT' : 'LOW';
            
            const rawImgs = (t.imageUrl ? String(t.imageUrl).split(',') : []).concat(t.finishImageUrl ? String(t.finishImageUrl).split(',') : [])
                .map(u => u.trim()).filter(u => u && u.startsWith('http'));
            
            const imgsHtml = rawImgs.map(u => `
                <div class="flex flex-col items-center gap-1.5 shrink-0 mb-1">
                    <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center border-2 border-white shadow-md overflow-hidden ring-1 ring-slate-100">
                        <img src="${u}" class="w-full h-full object-cover" onerror="handleImgError(this)">
                    </div>
                    <button onclick="window.open('${u}')" class="btn-view-img">VIEW</button>
                </div>
            `).join('');

            return `
            <div class="premium-card p-5 ${prioClass} ${isOver?'overdue':''} hover:scale-[1.01]">
                <div class="flex justify-between items-start">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="status-pill ${isDone?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'} uppercase">${t.type}</span>
                            <span class="status-pill ${p==='high'?'bg-rose-100 text-rose-600':p==='medium'?'bg-amber-100 text-amber-600':'bg-indigo-100 text-indigo-600'} uppercase">${prioLabel}</span>
                            ${isOver?'<span class="status-pill bg-rose-600 text-white animate-pulse">LATE</span>':''}
                        </div>
                        <h3 class="text-base font-extrabold text-slate-800 leading-snug mb-1 italic truncate">${prioEmoji} ${t.task}</h3>
                        <p class="text-xs text-indigo-600 font-black mb-3"><i class="fas fa-cube opacity-50 mr-1"></i>${t.asset}</p>
                        <div class="mb-4">
                            <div class="flex justify-between text-[8px] font-black text-slate-400 uppercase mb-1"><span>START: ${formatThaiDate(t.startDate)}</span><span>DEADLINE: ${formatThaiDate(t.deadline)}</span></div>
                            <div class="timeline-bar-bg"><div class="timeline-bar-fill ${isDone?'bg-emerald-500':isOver?'bg-rose-500':'bg-indigo-500'}" style="width: ${progress}%"></div></div>
                        </div>
                        <div class="flex items-start gap-4">
                            <div class="px-2 py-1 bg-slate-100 rounded-lg text-[9px] font-black text-slate-500 truncate max-w-[80px]">R: ${t.vendor||'-'}</div>
                            <div class="flex gap-3 items-center overflow-x-auto scrollbar-hide pb-1">${imgsHtml}</div>
                        </div>
                        ${t.reason ? `<div class="mt-4 p-3 bg-amber-50 rounded-2xl border border-amber-100 text-[10px] font-semibold text-amber-800 italic line-clamp-2"><i class="fas fa-sticky-note mr-1 opacity-50"></i>Note: ${t.reason}</div>` : ''}
                    </div>
                    <div class="flex flex-col gap-2 ml-4 shrink-0">
                        ${!isDone ? `<button onclick="window.openComp('${t.id}')" class="w-11 h-11 bg-emerald-500 text-white rounded-2xl shadow-lg flex items-center justify-center active:scale-90 transition-all"><i class="fas fa-check"></i></button><button onclick="window.openEdit('${t.id}')" class="w-11 h-11 bg-slate-900 text-white rounded-2xl shadow-lg flex items-center justify-center active:scale-90 transition-all"><i class="fas fa-pen text-[11px]"></i></button>` : ''}
                        <button onclick="window.openDel('${t.id}')" class="w-11 h-11 bg-white border border-slate-200 text-slate-300 rounded-2xl flex items-center justify-center active:bg-rose-600 active:text-white transition-all"><i class="fas fa-trash-alt text-[11px]"></i></button>
                    </div>
                </div>
            </div>`;
        };

        function render() { 
            const s = document.getElementById('searchInput').value.toLowerCase(); 
            const today = new Date().toLocaleDateString('en-CA');
            const sortMode = document.getElementById('sortActive').value;
            const priorityWeight = { high: 0, medium: 1, low: 2 };
            if(currentTab === 'dashboard') {
                document.getElementById('dashTotal').innerText = tasks.length;
                document.getElementById('dashPending').innerText = tasks.filter(t => t.status === 'pending').length;
                document.getElementById('dashCompleted').innerText = tasks.filter(t => t.status === 'completed').length;
                document.getElementById('dashOverdue').innerText = tasks.filter(t => t.status === 'pending' && t.deadline < today).length;
                updateCharts(tasks);
            }
            if(currentTab === 'active') {
                let activeTasks = tasks.filter(t => t.status === 'pending' && ((t.task||"").toLowerCase().includes(s) || (t.asset||"").toLowerCase().includes(s)));
                activeTasks.sort((a, b) => {
                    if (sortMode === 'deadline') return (a.deadline || '9999') > (b.deadline || '9999') ? 1 : -1;
                    if (sortMode === 'priority') return priorityWeight[a.priority || 'medium'] - priorityWeight[b.priority || 'medium'];
                    if (sortMode === 'type') return (a.type || '').localeCompare(b.type || '');
                    return 0;
                });
                document.getElementById('listActive').innerHTML = activeTasks.map(makeItem).join('') || '<div class="text-center py-20 text-slate-300 font-bold uppercase text-xs">No active jobs found</div>';
            }
            if(currentTab === 'history') {
                const fm = document.getElementById('filterMonth').value; const fa = document.getElementById('filterAsset').value;
                const historyTasks = tasks.filter(t => { const matchSearch = (t.task||"").toLowerCase().includes(s) || (t.asset||"").toLowerCase().includes(s); const matchMonth = !fm || (t.deadline && String(t.deadline).startsWith(fm)); const matchAsset = !fa || t.asset === fa; return t.status === 'completed' && matchSearch && matchMonth && matchAsset; });
                document.getElementById('listHistory').innerHTML = historyTasks.reverse().map(makeItem).join('') || '<p class="text-center py-20 text-slate-300 text-xs font-bold uppercase">No records found</p>';
            }
        }

        function updateCharts(data) {
            const types = {}; data.forEach(t => { types[t.type] = (types[t.type] || 0) + 1; });
            const ctx = document.getElementById('jobTypeChart').getContext('2d');
            if (jobChart) jobChart.destroy();
            jobChart = new Chart(ctx, { type: 'doughnut', data: { labels: Object.keys(types), datasets: [{ data: Object.values(types), backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#f43f5e', '#a855f7', '#06b6d4', '#ec4899'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 10, font: { size: 10, weight: 'bold' } } } }, cutout: '70%' } });
            const priorities = { high: 0, medium: 0, low: 0 }; data.filter(t => t.status === 'pending').forEach(t => { priorities[t.priority || 'medium']++; });
            const totalPending = Math.max(1, data.filter(t => t.status === 'pending').length);
            document.getElementById('priorityBars').innerHTML = Object.entries(priorities).map(([k, v]) => { const color = k==='high'?'rose':k==='medium'?'amber':'emerald'; const pct = (v/totalPending)*100; return `<div><div class="flex justify-between text-[10px] font-black uppercase mb-1"><span>${k.toUpperCase()}</span><span>${v} jobs</span></div><div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-${color}-500 rounded-full" style="width: ${pct}%"></div></div></div>`; }).join('');
        }

        function exportToCSV() { if(tasks.length === 0) return showToast("ไม่มีข้อมูล"); let csv = "\uFEFFID,Task,Asset,Type,StartDate,Deadline,Status,Technician,Priority,Reason\n"; tasks.forEach(t => { csv += `"${t.id}","${t.task}","${t.asset}","${t.type}","${t.startDate}","${t.deadline}","${t.status}","${t.vendor}","${t.priority || 'medium'}","${t.reason || ''}"\n`; }); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.setAttribute("download", `repair_report_${new Date().toLocaleDateString()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link); showToast("ส่งออกสำเร็จ"); }
        function updateFilters() { const fA = document.getElementById('filterAsset'); const fM = document.getElementById('filterMonth'); if(!fA || !fM) return; const molds = [...new Set(tasks.map(t => t.asset))].sort(); fA.innerHTML = '<option value="">ทุก Mold</option>' + molds.map(a => `<option value="${a}">${a}</option>`).join(''); const mons = [...new Set(tasks.filter(t => t.deadline).map(t => String(t.deadline).substring(0, 7)))].filter(m => m && m != "-").sort().reverse(); fM.innerHTML = '<option value="">ทุกเดือน</option>' + mons.map(m => `<option value="${m}">${m}</option>`).join(''); }
        window.resetFilters = () => { document.getElementById('filterMonth').value = ""; document.getElementById('filterAsset').value = ""; render(); };
        window.openEdit = id => { const t = tasks.find(x => x.id === id); if(!t) return; document.getElementById('edId').value = t.id; document.getElementById('edTask').value = t.task; document.getElementById('edEnd').value = t.deadline || ""; document.getElementById('edReason').value = t.reason || ""; document.getElementById('edPriority').value = String(t.priority || 'medium').toLowerCase(); edImgs = []; document.getElementById('preEd').innerHTML = ''; document.getElementById('editModal').style.display = 'block'; };
        window.openComp = id => { curId = id; outImgs = []; document.getElementById('preOut').innerHTML = ''; document.getElementById('compModal').style.display = 'block'; };
        window.openDel = id => { targetDelId = id; document.getElementById('delModal').style.display = 'block'; };
        window.onload = () => { fetchData(); switchTab('active'); };
        window.onclick = e => { if (e.target.className === 'modal') { closeM('editModal'); closeM('compModal'); closeM('delModal'); closeScanner(); } };
    </script>
</body>
</html>
