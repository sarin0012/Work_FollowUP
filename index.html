<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Follow UP | SARIN Premium Black</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Chart.js สำหรับ Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Kanit:wght@200;300;400;500;600&display=swap');
        
        :root {
            --primary: #6366f1; --secondary: #4f46e5; --accent: #10b981;
            --danger: #f43f5e; --warning: #f59e0b; --bg-slate: #f8fafc;
            --header-black: #020617; --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        body { font-family: 'Plus Jakarta Sans', 'Kanit', sans-serif; background-color: var(--bg-slate); color: #1e293b; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .premium-card { background: white; border-radius: 1.5rem; box-shadow: var(--card-shadow); border: 1px solid rgba(226, 232, 240, 0.8); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-btn { position: relative; transition: all 0.3s; }
        .tab-btn.active { color: var(--primary); font-weight: 700; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 4px; background: var(--primary); border-radius: 10px; }

        /* Modal Hierarchy */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); animation: fadeIn 0.3s ease; }
        #detailModal { z-index: 4000; }
        #categoryModal { z-index: 2500; }
        #editModal, #compModal, #delModal { z-index: 4500; }
        #scannerModal { z-index: 5000; }

        .modal-content { 
            background: white; margin: 5% auto; padding: 1.5rem; border-radius: 2rem; width: 92%; max-width: 600px; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: slideUp 0.4s ease; 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .status-pill { font-size: 0.55rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 9999px; text-transform: uppercase; white-space: nowrap; }
        
        /* Compact Table Styles */
        .table-row-item { 
            background: white; border-radius: 1rem; border: 1px solid #f1f5f9; display: flex; align-items: center; padding: 0.75rem 1rem; gap: 1rem; transition: all 0.2s; cursor: pointer;
        }
        .table-row-item:hover { background: #f8fafc; border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .row-num { min-width: 1.5rem; font-weight: 800; color: #cbd5e1; font-size: 0.9rem; font-style: italic; text-align: center; }
        
        .priority-indicator { width: 4px; height: 30px; border-radius: 4px; shrink: 0; }
        .prio-high-bg { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        .prio-medium-bg { background: var(--warning); }
        .prio-low-bg { background: var(--accent); }
        .prio-done-bg { background: #94a3b8; }

        .loader { border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        body.view-mode .action-only { display: none !important; }
        body.view-mode #addTaskSection { display: none !important; }

        .ai-loading { animation: pulse-blue 1.5s infinite; }
        @keyframes pulse-blue { 0% { background-color: #6366f1; } 50% { background-color: #a5b4fc; } 100% { background-color: #6366f1; } }
    </style>
</head>
<body class="min-h-screen">
    <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 p-4 px-8 bg-slate-900 text-white rounded-2xl text-sm font-semibold z-[6000] shadow-2xl flex items-center gap-3">
        <i class="fas fa-info-circle text-indigo-400"></i><span id="toastMsg"></span>
    </div>

    <div class="max-w-6xl mx-auto min-h-screen bg-slate-50 md:shadow-2xl overflow-hidden flex flex-col">
        <header class="bg-[#020617] pt-8 pb-14 px-6 md:px-12 text-white relative">
            <div class="absolute top-0 right-0 w-96 h-96 bg-indigo-600/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tighter italic bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Work Follow UP</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(99,102,241,0.8)]"></span>
                        <p class="text-[10px] font-bold opacity-60 uppercase tracking-[0.3em]" id="versionLabel">Responsive v3.26 | AI Backoff Fix</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.exportToCSV()" title="Export Excel" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-2xl border border-white/10 shadow-lg"><i class="fas fa-file-export text-xs"></i></button>
                    <button onclick="window.fetchData()" title="Refresh Data" class="w-10 h-10 flex items-center justify-center bg-indigo-600 text-white rounded-2xl transition-all shadow-lg"><i class="fas fa-sync-alt text-xs"></i></button>
                </div>
            </div>
        </header>

        <nav class="nav-blur sticky top-0 z-50 flex px-4 -mt-7 border-b border-slate-200 shadow-sm mx-4 md:mx-12 rounded-3xl premium-card overflow-hidden">
            <button onclick="window.switchTab('active')" id="tabActive" class="flex-1 py-4 text-[11px] md:text-sm font-bold transition-all tab-btn active">งานในมือ</button>
            <button onclick="window.switchTab('dashboard')" id="tabDashboard" class="flex-1 py-4 text-[11px] md:text-sm font-medium text-slate-400 transition-all tab-btn">สรุปงาน</button>
            <button onclick="window.switchTab('history')" id="tabHistory" class="flex-1 py-4 text-[11px] md:text-sm font-medium text-slate-400 transition-all tab-btn">ประวัติซ่อม</button>
        </nav>

        <main class="p-4 md:p-12 flex-1">
            <div id="filterWrapper" class="mb-6 max-w-4xl mx-auto space-y-3">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 pointer-events-none"><i class="fas fa-search text-xs"></i></div>
                    <input type="text" id="searchInput" oninput="window.render()" placeholder="ค้นหาชื่อโมล, อาการ..." class="w-full pl-10 pr-4 py-3 bg-white border-none rounded-2xl text-xs outline-none shadow-sm focus:ring-4 focus:ring-indigo-500/10 font-medium">
                </div>
                
                <div id="filterContainer" class="flex flex-row gap-2 p-2 bg-white rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex-1 relative border-r border-slate-100 pr-2">
                        <label class="text-[8px] font-black text-slate-400 absolute top-1 left-2 uppercase">เดือน</label>
                        <select id="filterMonth" onchange="window.render()" class="w-full pt-4 pb-1 px-2 bg-transparent text-[10px] font-bold outline-none border-none cursor-pointer"><option value="">ทั้งหมด</option></select>
                    </div>
                    <div class="flex-1 relative">
                        <label class="text-[8px] font-black text-slate-400 absolute top-1 left-2 uppercase">โมล</label>
                        <select id="filterAsset" onchange="window.render()" class="w-full pt-4 pb-1 px-2 bg-transparent text-[10px] font-bold outline-none border-none cursor-pointer"><option value="">ทั้งหมด</option></select>
                    </div>
                    <button onclick="window.resetFilters()" class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded-xl text-[9px] font-black uppercase">ล้าง</button>
                </div>
            </div>

            <!-- 1. ACTIVE LIST SECTION -->
            <div id="activeSection" class="space-y-3">
                <div id="addTaskSection" class="max-w-2xl mx-auto mb-6">
                    <details class="bg-indigo-600 rounded-2xl shadow-lg overflow-hidden group border-none transition-all">
                        <summary class="p-4 cursor-pointer font-bold text-white flex justify-between items-center text-xs md:text-sm list-none select-none">
                            <span class="flex items-center gap-3"><i class="fas fa-plus-circle"></i> บันทึกรายการใหม่</span>
                            <i class="fas fa-chevron-right text-[10px] transition-transform group-open:rotate-90"></i>
                        </summary>
                        <div class="p-5 pt-0 bg-white mx-1 mb-1 rounded-b-[1.5rem] space-y-4">
                            <div class="pt-5 flex gap-3">
                                <input type="file" id="aiFileIn" accept="image/*" class="hidden" onchange="window.runAIScan(this)">
                                <label for="aiFileIn" id="aiBtn" class="flex-[2] flex items-center justify-center gap-3 py-4 bg-indigo-600 text-white rounded-2xl cursor-pointer text-sm font-black shadow-lg hover:bg-indigo-700 transition-all">
                                    <i class="fas fa-robot text-lg"></i> 🤖 AI Scan
                                </label>
                                <button onclick="window.resetForm()" class="flex-1 flex items-center justify-center gap-2 py-4 bg-slate-100 text-slate-500 rounded-2xl text-xs font-bold hover:bg-slate-200 transition-all border border-slate-200">
                                    <i class="fas fa-broom"></i> ล้างฟอร์ม
                                </button>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">อาการเสีย / ปัญหา</label>
                                <input type="text" id="taskInput" placeholder="ระบุสิ่งที่ตรวจพบ..." class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-medium">
                            </div>
                            <textarea id="reasonInput" rows="2" placeholder="รายละเอียดเพิ่มเติม..." class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm italic font-medium"></textarea>
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-[10px] font-bold text-slate-400 uppercase">ประเภทงาน</label><select id="typeInput" onchange="window.toggleJobTypeOther(this.value)" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-bold"><optgroup label="Mold"><option value="Repair Mold">Repair Mold</option><option value="Spare part Mold">Spare part Mold</option><option value="Modify Mold">Modify Mold</option></optgroup><optgroup label="Machine"><option value="Repair machine">Repair machine</option></optgroup><option value="Other">ระบุเอง</option></select></div>
                                <div><label class="text-[10px] font-bold text-slate-400 uppercase">โมล/เครื่อง</label><div class="relative"><input type="text" id="assetInput" list="assetList" oninput="window.toggleOtherAsset(this.value)" placeholder="ค้นหา..." class="w-full p-3 pr-10 bg-slate-50 border-none rounded-xl text-sm font-bold"><button onclick="window.openScanner('assetInput')" class="absolute right-3 top-1/2 -translate-y-1/2 text-indigo-600"><i class="fas fa-qrcode"></i></button></div><datalist id="assetList"></datalist></div>
                            </div>
                            <div id="otherJobTypeWrapper" class="hidden"><input type="text" id="otherJobTypeInput" placeholder="ระบุประเภทงานใหม่..." class="w-full p-3 bg-white border-2 border-dashed border-indigo-100 rounded-xl text-sm font-medium"></div>
                            <div id="otherAssetWrapper" class="hidden"><input type="text" id="otherAssetInput" placeholder="ระบุชื่อใหม่..." class="w-full p-3 bg-white border-2 border-dashed border-indigo-100 rounded-xl text-sm font-medium"></div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-[10px] font-bold text-slate-400 uppercase">ความเร่งด่วน</label><select id="priorityInput" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-black"><option value="low">🟢 ต่ำ</option><option value="medium" selected>🟡 กลาง</option><option value="high">🔴 สูง</option></select></div>
                                <div><label class="text-[10px] font-bold text-slate-400 uppercase">ผู้รับผิดชอบ</label><select id="deptInput" onchange="window.toggleDeptOther(this.value)" class="w-full p-3 bg-indigo-50 border-none rounded-xl text-sm font-extrabold text-indigo-700"><option value="">-- เลือก --</option><option value="Sarin">Sarin</option><option value="WEN">WEN</option><option value="TP/MDS">TP/MDS</option><option value="PE">PE</option><option value="Other">ระบุเอง</option></select></div>
                            </div>
                            <div id="otherDeptWrapper" class="hidden"><input type="text" id="otherDeptInput" placeholder="ชื่อแผนก/ผู้รับผิดชอบ..." class="w-full p-3 bg-white border-2 border-dashed border-indigo-100 rounded-xl text-sm font-medium"></div>
                            <div class="flex gap-4">
                                <div class="flex-1"><label class="text-[10px] font-bold text-slate-400 uppercase">เริ่ม</label><input type="date" id="startInput" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-medium"></div>
                                <div class="flex-1"><label class="text-[10px] font-bold text-slate-400 uppercase">กำหนดเสร็จ</label><input type="date" id="endInput" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-bold text-rose-500"></div>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex-1"><label class="text-[10px] font-bold text-slate-400 uppercase">แนบรูป</label><input type="file" id="fileIn" multiple accept="image/*" onchange="window.handleImg(this, 'preIn', 'in')" class="hidden"><label for="fileIn" class="flex items-center gap-2 mt-1 w-fit px-4 py-2 bg-slate-100 rounded-xl cursor-pointer text-[10px] font-bold text-slate-600"><i class="fas fa-image"></i> เลือกรูป</label></div>
                                <div id="preIn" class="flex gap-2 overflow-x-auto max-w-[60%] py-1 font-bold text-[10px]"></div>
                            </div>
                            <button onclick="window.save()" id="saveBtn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase text-sm shadow-xl flex justify-center items-center gap-3">บันทึกข้อมูล <div class="loader" id="saveLd"></div></button>
                        </div>
                    </details>
                </div>
                
                <div id="listActive" class="flex flex-col gap-2 max-w-4xl mx-auto"></div>
            </div>

            <!-- 2. DASHBOARD SECTION -->
            <div id="dashboardSection" class="hidden space-y-8 animate-fadeIn">
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div onclick="window.showStatusDetails('all')" class="premium-card p-5 border-l-8 border-indigo-500 cursor-pointer summary-card transition-all text-center"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">งานทั้งหมด</p><p id="dashTotal" class="text-3xl font-black text-slate-800">0</p></div>
                    <div onclick="window.showStatusDetails('pending')" class="premium-card p-5 border-l-8 border-amber-500 cursor-pointer summary-card transition-all text-center"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">รอดำเนินการ</p><p id="dashPending" class="text-3xl font-black text-slate-800">0</p></div>
                    <div onclick="window.showStatusDetails('completed')" class="premium-card p-5 border-l-8 border-slate-400 cursor-pointer summary-card transition-all text-center"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">เสร็จสิ้น</p><p id="dashSuccessRate" class="text-3xl font-black text-slate-800">0</p></div>
                    <div onclick="window.showStatusDetails('overdue')" class="premium-card p-5 border-l-8 border-rose-500 cursor-pointer summary-card transition-all text-center"><p class="text-[10px] font-bold text-slate-400 uppercase mb-1">เกินกำหนด</p><p id="dashOverdue" class="text-3xl font-black text-slate-800">0</p></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2">
                        <h3 class="text-base font-extrabold uppercase italic text-slate-800 flex items-center gap-2 mb-6"><i class="fas fa-layer-group text-indigo-500"></i> Job Categories</h3>
                        <div id="jobCategoryGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
                    </div>
                    <div class="premium-card p-6 flex flex-col">
                        <h3 class="text-sm font-extrabold mb-6 uppercase italic flex items-center gap-2 text-rose-500"><i class="fas fa-exclamation-triangle"></i> Top 5 Problematic</h3>
                        <div id="topAssetsList" class="flex flex-col gap-2 flex-1"></div>
                        <div class="mt-6 pt-4 border-t"><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Lead Time เฉลี่ย (วัน)</p><p id="avgLeadTime" class="text-3xl font-black text-indigo-600">0.0</p></div>
                    </div>
                </div>
            </div>

            <!-- 3. HISTORY SECTION -->
            <div id="historySection" class="hidden space-y-6 animate-fadeIn"><div id="listHistory" class="flex flex-col gap-2 max-w-4xl mx-auto"></div></div>
        </main>
    </div>

    <!-- MODALS -->
    <div id="editModal" class="modal"><div class="modal-content"><h2 class="text-xl md:text-2xl font-black text-slate-800 mb-6 italic flex items-center gap-2 uppercase"><i class="fas fa-edit text-indigo-500"></i> Edit Job</h2><div class="space-y-4"><input type="hidden" id="edId"><input type="text" id="edTask" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm font-semibold" placeholder="อาการเสีย"><div class="grid grid-cols-2 gap-4"><input type="date" id="edStart" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm font-black"><input type="date" id="edEnd" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm font-black text-rose-500"></div><select id="edPriority" class="w-full p-4 bg-slate-50 rounded-2xl text-sm font-black"><option value="low">🟢 งานทั่วไป</option><option value="medium">🟡 เร่งด่วน</option><option value="high">🔴 ด่วนที่สุด</option></select><div class="py-1"><input type="file" id="fileEd" multiple accept="image/*" onchange="window.handleImg(this, 'preEd', 'ed')" class="hidden"><label for="fileEd" class="flex items-center gap-2 mt-1 w-fit px-4 py-2 bg-slate-100 rounded-xl cursor-pointer text-[10px] font-bold text-slate-600"><i class="fas fa-image"></i> เลือกรูปใหม่</label><div id="preEd" class="flex gap-2 mt-2 overflow-x-auto"></div></div><textarea id="edReason" rows="2" placeholder="ระบุเหตุผล..." class="w-full p-4 bg-slate-50 border-none rounded-2xl text-sm italic font-medium"></textarea><div class="flex gap-3 pt-4"><button onclick="window.closeM('editModal')" class="flex-1 py-4 text-slate-400 font-bold text-xs uppercase">ยกเลิก</button><button onclick="window.completeUpdate()" id="upBtn" class="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-black text-xs shadow-xl transition-all">อัปเดต</button></div></div></div></div>
    <div id="compModal" class="modal"><div class="modal-content text-center"><div class="w-16 h-16 md:w-20 md:h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl shadow-inner animate-bounce"><i class="fas fa-check-double"></i></div><h2 class="text-xl md:text-2xl font-extrabold mb-1 uppercase">Job Finished</h2><input type="file" id="fileOut" multiple accept="image/*" onchange="window.handleImg(this, 'preOut', 'out')" class="hidden"><label for="fileOut" class="inline-flex items-center gap-2 px-6 py-3 bg-slate-100 hover:bg-slate-200 rounded-2xl cursor-pointer text-[11px] font-black text-slate-600 mb-6 border">เลือกรูปงานเสร็จ</label><div id="preOut" class="flex flex-wrap gap-2 mb-8 justify-center"></div><div class="flex gap-4"><button onclick="window.closeM('compModal')" class="flex-1 py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-400 uppercase">ยกเลิก</button><button onclick="window.completeJobAction()" id="cpBtn" class="flex-[2] py-4 bg-emerald-600 text-white rounded-2xl text-xs font-black shadow-lg">ปิดงาน</button></div></div></div>
    <div id="delModal" class="modal"><div class="modal-content text-center p-8"><div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl md:text-3xl"><i class="fas fa-trash-alt"></i></div><h2 class="text-xl md:text-2xl font-extrabold mb-2 uppercase">ลบรายการ?</h2><div class="flex gap-4"><button onclick="window.closeM('delModal')" class="flex-1 py-4 bg-slate-100 rounded-2xl text-xs font-black text-slate-500 uppercase">ยกเลิก</button><button onclick="window.confirmDel()" id="delBtn" class="flex-1 py-4 bg-rose-600 text-white rounded-2xl text-xs font-black shadow-lg">ลบ</button></div></div></div>
    <div id="scannerModal" class="modal"><div class="modal-content text-center overflow-hidden !p-0"><div class="p-4 md:p-6"><h2 class="text-lg md:text-xl font-black mb-4 uppercase italic text-indigo-600"><i class="fas fa-qrcode"></i> QR SCANNER</h2><div id="reader"></div><button onclick="window.closeScanner()" class="w-full py-3 bg-slate-100 rounded-xl text-[11px] font-bold text-slate-500 uppercase mt-4">ปิดหน้าต่าง</button></div></div></div>
    <div id="detailModal" class="modal"><div class="modal-content !max-w-2xl"><div class="flex justify-between items-center mb-6"><h2 id="detailTitle" class="text-xl md:text-2xl font-black italic uppercase">Job Details</h2><button onclick="window.closeM('detailModal')" class="text-slate-400"><i class="fas fa-times"></i></button></div><div id="detailBody" class="space-y-6"></div></div></div>
    <div id="categoryModal" class="modal"><div class="modal-content !max-w-4xl"><div class="flex justify-between items-center mb-4 border-b pb-4"><div><h2 id="categoryTitle" class="text-xl font-black italic uppercase">Job List</h2><p id="categorySubtitle" class="text-[10px] font-bold text-slate-400 uppercase mt-2"></p></div><button onclick="window.closeM('categoryModal')" class="text-slate-400"><i class="fas fa-times"></i></button></div><div id="categoryBody" class="flex flex-col gap-2"></div></div></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx22bXXlnz7BWgvaxVLljL1Mzl_ADbjL-YlP2pdbupEsSPw2O_QE6nguzrJo6hGIM89Ow/exec";
        const apiKey = "";

        window.runAIScan = async (input) => {
            if (!input.files || !input.files[0]) return;

            const originalText = label.innerHTML;

            label.classList.add('ai-loading');
            try {
                const file = input.files[0];
                const mimeType = file.type || "image/jpeg";
                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
                
                const systemPrompt = "Extract maintenance details from the image and return ONLY strictly valid JSON. Format: { \"task\": \"อาการเสีย\", \"type\": \"Repair Mold, Spare part Mold, Modify Mold, Repair machine\", \"asset\": \"รหัสโมล\", \"vendor\": \"ผู้รับผิดชอบ\", \"startDate\": \"YYYY-MM-DD\", \"deadline\": \"YYYY-MM-DD\" }";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                
                let success = false;
                let result;
                const delays = [1000, 2000, 4000, 8000, 16000];
                
                for (let i = 0; i <= delays.length; i++) {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ role: "user", parts: [{ text: "Extract details and output JSON." }, { inlineData: { mimeType: mimeType, data: base64Data } }] }],
                                systemInstruction: { parts: [{ text: systemPrompt }] },
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });
                        
                        if (response.ok) {
                            result = await response.json();
                            success = true;
                            break;
                        } else {
                            if (i === delays.length) {
                                const errRes = await response.json().catch(()=>({}));
                                throw new Error(errRes.error?.message || `API Error ${response.status}`);
                            }
                        }
                    } catch (err) {
                        if (i === delays.length) throw err;
                    }
                    if (i < delays.length) await new Promise(r => setTimeout(r, delays[i]));
                }
                
                let text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("No text response");
                
                text = text.replace(/```json/ig, '').replace(/```/g, '').trim();
                const startIdx = text.indexOf('{');
                const endIdx = text.lastIndexOf('}');
                if (startIdx !== -1 && endIdx !== -1) text = text.substring(startIdx, endIdx + 1);
                
                const data = JSON.parse(text);

                console.error("AI Error:", e);

                label.classList.remove('ai-loading');

        window.showAssetDetails = (name) => { const filtered = tasks.filter(t => t.asset === name); document.getElementById('categoryTitle').innerText = name; document.getElementById('categoryBody').innerHTML = window.buildSplitList(filtered); document.getElementById('categoryModal').style.display = 'block'; };
        window.showStatusDetails = (type) => { let filtered = []; let title = ""; const today = new Date().toLocaleDateString('en-CA'); if (type === 'all') { filtered = tasks; title = "งานทั้งหมด"; } else if (type === 'pending') { filtered = tasks.filter(t => t.status === 'pending'); title = "งานรอดำเนินการ"; } else if (type === 'completed') { filtered = tasks.filter(t => t.status === 'completed'); title = "งานเสร็จสิ้น"; } else if (type === 'overdue') { filtered = tasks.filter(t => t.status === 'pending' && t.deadline < today); title = "งานเกินกำหนด"; } document.getElementById('categoryTitle').innerText = title; document.getElementById('categoryBody').innerHTML = window.buildSplitList(filtered); document.getElementById('categoryModal').style.display = 'block'; };
        window.showJobTypeDetails = (typeLabel) => { const filtered = tasks.filter(t => t.type === typeLabel); document.getElementById('categoryTitle').innerText = typeLabel; document.getElementById('categoryBody').innerHTML = window.buildSplitList(filtered); document.getElementById('categoryModal').style.display = 'block'; };

        window.updateFilters = () => { const fA = document.getElementById('filterAsset'); const fM = document.getElementById('filterMonth'); if(!fA || !fM) return; const molds = [...new Set(tasks.map(t => t.asset))].sort(); fA.innerHTML = '<option value="">ทั้งหมด</option>' + molds.map(a => `<option value="${a}">${a}</option>`).join(''); const mons = [...new Set(tasks.filter(t => t.deadline).map(t => String(t.deadline).substring(0, 7)))].filter(m => m && m != "-").sort().reverse(); fM.innerHTML = '<option value="">ทั้งหมด</option>' + mons.map(m => `<option value="${m}">${m}</option>`).join(''); };
        window.resetFilters = () => { if(document.getElementById('filterMonth')) document.getElementById('filterMonth').value = ""; if(document.getElementById('filterAsset')) document.getElementById('filterAsset').value = ""; window.render(); };
        window.exportToCSV = () => { if(tasks.length === 0) return window.showToast("ไม่มีข้อมูล"); let csv = "\uFEFFID,Task,Asset,Type,StartDate,Deadline,Status,Technician,Priority,Reason\n"; tasks.forEach(t => { csv += `"${t.id}","${t.task}","${t.asset}","${t.type}","${t.startDate}","${t.deadline}","${t.status}","${t.vendor}","${t.priority || 'medium'}","${t.reason || ''}"\n`; }); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.setAttribute("download", `report_${new Date().toLocaleDateString()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link); window.showToast("ส่งออกสำเร็จ"); };
        
        window.onload = () => { setTimeout(() => { window.fetchData(); window.switchTab(isViewOnly ? 'dashboard' : 'active'); }, 100); };
        window.onclick = e => { if (e.target.className.includes('modal')) { ['editModal', 'detailModal', 'categoryModal', 'compModal', 'delModal', 'scannerModal'].forEach(id => window.closeM(id)); } };
    </script>
</body>
</html>
